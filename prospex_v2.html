                    <div className="flex-1" style={{ minWidth: 0 }}>
                      <div className="fw-6 txt-14">{c.name}</div>
                      <div className="txt-12 txt-muted mt-1">{c.share}% da carteira · {brl(c.value)}/mês</div>
                    </div>
                    <div className="italic-serif" style={{ fontSize: 22, color: 'var(--accent)' }}>{c.share}%</div>
                  </div>
                  <Progress value={c.share} max={20} tone="accent"/>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="section mt-4 fade-in-delay-3">
          <div className="section-title">Top clientes por faturamento <span className="count">5</span></div>
          <div className="list">
            {topClients.map((c, i) => (
              <div key={c.id} className="card" style={{ padding: 12 }}>
                <div className="row gap-3 mb-2">
                  <div className="italic-serif" style={{ fontSize: 22, minWidth: 22, textAlign: 'right', color: i === 0 ? 'var(--accent)' : 'var(--muted)' }}>{i+1}</div>
                  <AvatarInit name={c.name} sm/>
                  <div className="flex-1" style={{ minWidth: 0 }}>
                    <div className="fw-6 txt-14" style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{c.name}</div>
                    <div className="txt-12 txt-muted">{c.city}</div>
                  </div>
                  <div className="tabular fw-6 txt-13">{brl(c.revenue, {compact:true})}</div>
                </div>
                <Progress value={c.revenue} max={maxRev} tone={i === 0 ? 'accent' : ''}/>
              </div>
            ))}
          </div>
        </div>

        <div className="section mt-4">
          <div className="section-title">Últimas visitas <span className="count">{LAST_VISITS.length}</span></div>
          <div className="list">
            {LAST_VISITS.map(v => (
              <div key={v.id} className={`visit-card ${v.pendingReturn ? 'pending' : ''}`}>
                <div className="ico" style={{
                  background: v.kind === 'positive' ? 'var(--positive-soft)' : v.kind === 'negative' ? 'var(--danger-soft)' : 'var(--warn-soft)',
                  color: v.kind === 'positive' ? 'var(--positive-ink)' : v.kind === 'negative' ? 'var(--danger-ink)' : 'var(--warn-ink)'
                }}>
                  {v.kind === 'positive' ? <Icon.thumbsUp size={16}/> : v.kind === 'negative' ? <Icon.thumbsDown size={16}/> : <Icon.history size={16}/>}
                </div>
                <div className="body">
                  <div className="row-between">
                    <div className="name">{v.name}</div>
                    {v.pendingReturn && <span className="badge badge-accent">Retornar</span>}
                  </div>
                  <div className="result">{v.result}{v.value ? ` · ${brl(v.value)}` : ''}</div>
                </div>
                <div className="date">{v.date}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   Screen 9 — Check-in de visita
   ============================================================ */
const RESULT_OPTIONS = [
  { value: 'pedido_fechado',   label: 'Pedido fechado',           desc: 'Venda realizada nesta visita',                    kind: 'positive' },
  { value: 'pedido_ampliado',  label: 'Pedido ampliado',          desc: 'Já era cliente e aumentou o volume',              kind: 'positive' },
  { value: 'reativacao',       label: 'Reativação',               desc: 'Cliente inativo que voltou a comprar',            kind: 'positive' },
  { value: 'amostra',          label: 'Entrega de amostra',       desc: 'Deixou amostra para avaliação',                   kind: 'neutral'  },
  { value: 'demonstracao',     label: 'Demonstração realizada',   desc: 'Apresentou produto sem fechar pedido',            kind: 'neutral'  },
  { value: 'negociacao',       label: 'Negociação em andamento',  desc: 'Está avaliando proposta enviada',                 kind: 'neutral'  },
  { value: 'retornar',         label: 'Retornar depois',          desc: 'Precisa de nova visita agendada',                 kind: 'pending'  },
  { value: 'nao_estava',       label: 'Não estava',               desc: 'Responsável ausente na visita',                   kind: 'pending'  },
  { value: 'sem_interesse',    label: 'Sem interesse',            desc: 'Recusou a abordagem por enquanto',                kind: 'negative' },
  { value: 'outros',           label: 'Outros',                   desc: 'Descreva nas observações',                        kind: 'neutral'  },
];

const CORTES_DISPONIVEIS = [
  'Picanha','Contra-filé','Fraldinha','Maminha','Patinho','Alcatra',
  'Cupim','Costela','Acém','Coxão mole','Coxão duro','Músculo',
  'Linguiça','Ancho','Bife de chorizo','Filé mignon','Ossobuco',
];

function CheckInScreen({ back, user, theme, onToggleTheme }) {
  const [clientInput, setClientInput] = useState('');
  const [clientType, setClientType] = useState('');
  const [result, setResult] = useState('');
  const [orderValue, setOrderValue] = useState('');
  const [selectedCuts, setSelectedCuts] = useState([]);
  const [shelfBrands, setShelfBrands] = useState('');
  const [shelfProducts, setShelfProducts] = useState('');
  const [notes, setNotes] = useState('');
  const [showToast, setShowToast] = useState(false);
  const [leaving, setLeaving] = useState(false);

  const allClients = [
    ...CLIENTS.map(c=>({name:c.name, type:'ativo', badge:'badge-active'})),
    ...CLIENTS.filter(c=>c.status==='inactive').map(c=>({name:c.name, type:'inativo', badge:'badge-inactive'})),
    ...PROSPECTS.map(p=>({name:p.name, type:'prospecto', badge:'badge-accent'})),
  ];

  const selectedResult = RESULT_OPTIONS.find(r=>r.value===result);
  const valid = clientInput.trim() && result;

  function toggleCut(cut) {
    setSelectedCuts(prev => prev.includes(cut) ? prev.filter(c=>c!==cut) : [...prev, cut]);
  }

  function save() {
    if (!valid) return;
    setShowToast(true);
    setLeaving(false);
    setTimeout(() => setLeaving(true), 2400);
    setTimeout(() => {
      setShowToast(false);
      setClientInput(''); setClientType(''); setResult('');
      setOrderValue(''); setSelectedCuts([]); setShelfBrands('');
      setShelfProducts(''); setNotes('');
    }, 2800);
  }

  const kindColor = { positive:'var(--positive)', neutral:'var(--info)', pending:'var(--warn)', negative:'var(--danger)' };

  return (
    <div className="screen screen-enter" data-screen-label="09 Checkin">
      <Header user={user} theme={theme} onToggleTheme={onToggleTheme} onBack={back} subtitle="Check-in"/>
      <div className="screen-pad" style={{ position: 'relative', minHeight: '100%' }}>
        <div className="eyebrow">Registrar</div>
        <h2 className="h2 mt-1">Como foi a <em className="italic-serif">visita?</em></h2>
        <p className="lede">Registre os detalhes — leva menos de 1 minuto.</p>

        <div className="card mt-3" style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>

          {/* Cliente */}
          <div className="field">
            <label className="field-label">Cliente visitado</label>
            <div className="input-icon">
              <Icon.briefcase size={16}/>
              <input className="input" value={clientInput} onChange={e=>{
                setClientInput(e.target.value);
                const found = allClients.find(cl=>cl.name.toLowerCase()===e.target.value.toLowerCase());
                if(found) setClientType(found.type); else setClientType('');
              }} placeholder="Nome do cliente ou prospecto..." list="ci-clients-list"/>
              <datalist id="ci-clients-list">
                {allClients.map((cl,i) => <option key={i} value={cl.name}/>)}
              </datalist>
            </div>
            {clientType && (
              <div className="mt-1">
                <span className={`badge ${clientType==='ativo'?'badge-active':clientType==='inativo'?'badge-inactive':'badge-accent'}`}>
                  {clientType==='ativo'?'Cliente ativo':clientType==='inativo'?'Cliente inativo':'Prospecto'}
                </span>
              </div>
            )}
          </div>

          {/* Resultado */}
          <div className="field">
            <label className="field-label">Resultado da visita</label>
            <select className="select" value={result} onChange={e=>setResult(e.target.value)}>
              <option value="">Selecione o resultado...</option>
              {RESULT_OPTIONS.map(r => (
                <option key={r.value} value={r.value}>{r.label}</option>
              ))}
            </select>
            {selectedResult && (
              <div className="mt-1 bordered-item" style={{
                borderLeftColor: kindColor[selectedResult.kind],
                background: 'var(--surface-2)',
                padding: '6px 10px',
                fontSize: 12,
                color: 'var(--muted)'
              }}>
                {selectedResult.desc}
              </div>
            )}
          </div>

          {/* Valor */}
          {['pedido_fechado','pedido_ampliado','reativacao'].includes(result) && (
            <div className="field">
              <label className="field-label">Valor do pedido (R$)</label>
              <div className="input-icon">
                <Icon.dollar size={16}/>
                <input className="input" type="number" value={orderValue} onChange={e=>setOrderValue(e.target.value)} placeholder="0,00"/>
              </div>
            </div>
          )}

          {/* Cortes selecionados */}
          {['pedido_fechado','pedido_ampliado','reativacao','amostra'].includes(result) && (
            <div className="field">
              <label className="field-label">Cortes do pedido <span className="txt-12 txt-muted">(selecione todos)</span></label>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 6 }}>
                {CORTES_DISPONIVEIS.map(cut => (
                  <button key={cut} type="button"
                    onClick={()=>toggleCut(cut)}
                    style={{
                      padding: '5px 11px', borderRadius: 20, fontSize: 12, fontWeight: 500,
                      border: selectedCuts.includes(cut) ? '1.5px solid var(--accent)' : '1px solid var(--border)',
                      background: selectedCuts.includes(cut) ? 'var(--accent-soft)' : 'var(--surface-2)',
                      color: selectedCuts.includes(cut) ? 'var(--accent-strong)' : 'var(--muted)',
                      cursor: 'pointer', transition: 'all 0.12s'
                    }}>
                    {selectedCuts.includes(cut) ? '✓ ' : ''}{cut}
                  </button>
                ))}
              </div>
              {selectedCuts.length > 0 && (
                <div className="txt-12 txt-muted mt-2">{selectedCuts.length} corte{selectedCuts.length!==1?'s':''} selecionado{selectedCuts.length!==1?'s':''}</div>
              )}
            </div>
          )}

          {/* Prateleira */}
          <div className="field">
            <label className="field-label">Prateleira / Expositor <span className="txt-12 txt-muted">(opcional)</span></label>
            <input className="input mb-2" value={shelfBrands} onChange={e=>setShelfBrands(e.target.value)} placeholder="Marcas concorrentes observadas..."/>
            <input className="input" value={shelfProducts} onChange={e=>setShelfProducts(e.target.value)} placeholder="Cortes/produtos expostos..."/>
          </div>

          {/* Observações */}
          <div className="field">
            <label className="field-label">Observações</label>
            <textarea className="textarea" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="O que conversaram? Próximos passos? Informações relevantes..."/>
          </div>

          <button className="btn btn-primary btn-block" onClick={save} disabled={!valid}>
            <Icon.send size={16}/> Salvar visita
          </button>
          {!valid && <p className="txt-12 txt-muted" style={{ textAlign: 'center', marginTop: 4 }}>Preencha cliente e resultado para salvar</p>}
        </div>

        {showToast && (
          <div className={`toast-success ${leaving ? 'is-leaving' : ''}`}>
            <Icon.check size={18}/>
            <div className="flex-1">Visita registrada com sucesso!</div>
          </div>
        )}
      </div>
    </div>
  );
}

Object.assign(window, {
  ProspListScreen, ProspDetailScreen, MapScreen, IndicadoresScreen, CheckInScreen,
});

  </script>

  <script type="text/babel" data-presets="react">
/* =========================================================================
   APP SHELL — routing, theme, palette, tweaks panel
   ========================================================================= */
/* eslint-disable */
/* Prospex BI — App shell with routing, theme, tweaks */

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "comfortable",
  "theme": "light",
  "palette": "default"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = useState({ name: 'login', params: {} });
  const [history, setHistory] = useState([]);

  // Apply theme + density + palette to <html>
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', t.theme);
    document.documentElement.setAttribute('data-density', t.density);
    if (t.palette && t.palette !== 'default') {
      document.documentElement.setAttribute('data-palette', t.palette);
    } else {
      document.documentElement.removeAttribute('data-palette');
    }
  }, [t.theme, t.density, t.palette]);

  function go(name, params = {}) {
    setHistory(h => [...h, route]);
    setRoute({ name, params });
    // scroll the screen container to top after transition
    requestAnimationFrame(() => {
      const el = document.querySelector('.screen');
      if (el) el.scrollTop = 0;
    });
  }
  function back() {
    setHistory(h => {
      if (h.length === 0) return h;
      const prev = h[h.length - 1];
      setRoute(prev);
      return h.slice(0, -1);
    });
  }
  function logout() {
    setRoute({ name: 'login', params: {} });
    setHistory([]);
  }
  function toggleTheme() {
    setTweak('theme', t.theme === 'dark' ? 'light' : 'dark');
  }

  const user = MOCK_USER;
  const common = { user, theme: t.theme, onToggleTheme: toggleTheme };

  let view;
  switch (route.name) {
    case 'login':
      view = <LoginScreen onLogin={() => go('home')} theme={t.theme} onToggleTheme={toggleTheme}/>;
      break;
    case 'home':
      view = <HomeScreen go={go} onLogout={logout} {...common}/>;
      break;
    case 'diagnostico':
      view = <DiagListScreen go={go} back={back} {...common}/>;
      break;
    case 'diagnostico-detalhe':
      view = <DiagDetailScreen id={route.params.id} back={back} {...common}/>;
      break;
    case 'prospeccao':
      view = <ProspListScreen go={go} back={back} {...common}/>;
      break;
    case 'prospeccao-detalhe':
      view = <ProspDetailScreen id={route.params.id} back={back} {...common}/>;
      break;
    case 'mapa':
      view = <MapScreen back={back} {...common}/>;
      break;
    case 'indicadores':
      view = <IndicadoresScreen back={back} {...common}/>;
      break;
    case 'checkin':
      view = <CheckInScreen back={back} {...common}/>;
      break;
    default:
      view = <HomeScreen go={go} {...common}/>;
  }

  return (
    <div className="stage">
      <div className="device" key={route.name + JSON.stringify(route.params)}>
        {view}
      </div>
      <TweaksPanel>
        <TweakSection label="Paleta">
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 6, padding: '4px 14px 8px' }}>
            {[
              { v: 'default', name: 'Mono + Azul',    bg: '#ffffff', ink: '#09090b', accent: '#2563eb' },
              { v: 'warm',    name: 'Creme + Coral',  bg: '#f4efe6', ink: '#15110e', accent: '#e94b27' },
              { v: 'lime',    name: 'Mono + Lima',    bg: '#fafafa', ink: '#09090b', accent: '#65a30d' },
              { v: 'navy',    name: 'Azul Naval',     bg: '#f8fafc', ink: '#0c2340', accent: '#0891b2' },
              { v: 'plum',    name: 'Stone + Roxo',   bg: '#fafaf9', ink: '#1c1917', accent: '#9333ea' },
            ].map(p => (
              <button key={p.v}
                      onClick={()=>setTweak('palette', p.v)}
                      title={p.name}
                      style={{
                        height: 38, padding: 0, borderRadius: 8, cursor: 'pointer',
                        border: t.palette === p.v ? '2px solid #2563eb' : '1px solid rgba(0,0,0,0.15)',
                        background: p.bg, position: 'relative', overflow: 'hidden',
                      }}>
                <span style={{ position:'absolute', left:5, top:5, width:11, height:11, borderRadius:3, background: p.ink }}/>
                <span style={{ position:'absolute', right:5, bottom:5, width:16, height:16, borderRadius:'50%', background: p.accent }}/>
              </button>
            ))}
          </div>
        </TweakSection>
        <TweakSection label="App">
          <TweakRadio label="Densidade" value={t.density} onChange={v=>setTweak('density', v)}
                      options={[{value:'comfortable', label:'Confort.'}, {value:'compact', label:'Compacto'}]}/>
          <TweakRadio label="Tema" value={t.theme} onChange={v=>setTweak('theme', v)}
                      options={[{value:'light', label:'Claro'}, {value:'dark', label:'Escuro'}]}/>
        </TweakSection>
        <TweakSection label="Ir para tela">
          <TweakButton label="01 · Login" onClick={()=>go('login')}/>
          <TweakButton label="02 · Home" onClick={()=>go('home')}/>
          <TweakButton label="03 · Diagnóstico — lista" onClick={()=>go('diagnostico')}/>
          <TweakButton label="04 · Diagnóstico — detalhe" onClick={()=>go('diagnostico-detalhe', {id:'c1'})}/>
          <TweakButton label="05 · Prospecção — lista" onClick={()=>go('prospeccao')}/>
          <TweakButton label="06 · Prospecção — detalhe" onClick={()=>go('prospeccao-detalhe', {id:'p3'})}/>
          <TweakButton label="07 · Mapa & Rota" onClick={()=>go('mapa')}/>
          <TweakButton label="08 · Indicadores" onClick={()=>go('indicadores')}/>
          <TweakButton label="09 · Check-in de visita" onClick={()=>go('checkin')}/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

  </script>
</body>
</html>
