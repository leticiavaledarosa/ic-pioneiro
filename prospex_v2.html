<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Prospex BI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
  <style>
/* ============================================================
   Prospex BI — Design tokens
   ============================================================ */
:root {
  /* ── DEFAULT PALETTE: mono + blue ──────────────────────── */
  --ink: #09090b;
  --ink-soft: #27272a;
  --muted: #71717a;
  --bg: #ffffff;
  --bg-tinted: #f4f4f5;
  --surface: #ffffff;
  --surface-2: #fafafa;
  --surface-inverse: #09090b;
  --on-inverse: #fafafa;
  --on-inverse-muted: #a1a1aa;

  --accent: #2563eb;
  --accent-ink: #ffffff;
  --accent-soft: #dbeafe;
  --accent-strong: #1d4ed8;

  --positive: #16a34a;
  --positive-soft: #dcfce7;
  --positive-ink: #14532d;

  --warn: #d97706;
  --warn-soft: #fef3c7;
  --warn-ink: #92400e;

  --danger: #dc2626;
  --danger-soft: #fee2e2;
  --danger-ink: #991b1b;

  --info: #0284c7;
  --info-soft: #e0f2fe;

  --border: #e4e4e7;
  --border-strong: #d4d4d8;

  --shadow-sm: 0 1px 2px rgba(9, 9, 11, 0.04);
  --shadow-md: 0 4px 14px rgba(9, 9, 11, 0.06), 0 1px 3px rgba(9, 9, 11, 0.04);
  --shadow-lg: 0 24px 60px -20px rgba(9, 9, 11, 0.18), 0 8px 20px -8px rgba(9, 9, 11, 0.12);
  --shadow-card: 0 1px 0 rgba(9, 9, 11, 0.04), 0 1px 3px rgba(9, 9, 11, 0.06);

  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;

  /* density-controlled spacing */
  --pad-screen: 20px;
  --pad-card: 18px;
  --gap-list: 12px;
  --gap-section: 24px;
  --line-h: 1.45;
  --fs-body: 15px;
  --fs-small: 13px;
  --fs-micro: 11px;
}

/* ============================================================
   Alternate palettes (toggle via [data-palette])
   ============================================================ */

/* warm — the original cream + coral */
:root[data-palette="warm"] {
  --ink: #15110e;
  --ink-soft: #4a4339;
  --muted: #7a6f62;
  --bg: #f4efe6;
  --bg-tinted: #ece6d8;
  --surface: #ffffff;
  --surface-2: #faf6ef;
  --surface-inverse: #15110e;
  --on-inverse: #f4efe6;
  --on-inverse-muted: #a89e8e;
  --accent: #e94b27;
  --accent-soft: #fbe8df;
  --accent-strong: #c83a18;
  --positive: #1f7a3a;
  --positive-soft: #dff1e4;
  --positive-ink: #0f4d22;
  --warn: #a86512;
  --warn-soft: #faefd3;
  --warn-ink: #7a4707;
  --danger: #b91c1c;
  --danger-soft: #fbe3e3;
  --danger-ink: #7e1212;
  --info: #1f4f8a;
  --info-soft: #e1ebf7;
  --border: #ebe2d2;
  --border-strong: #d9cdb7;
}

/* lime — sharp mono + electric green */
:root[data-palette="lime"] {
  --bg: #fafafa;
  --bg-tinted: #f4f4f5;
  --accent: #65a30d;
  --accent-ink: #ffffff;
  --accent-soft: #ecfccb;
  --accent-strong: #4d7c0f;
}

/* navy — corporate deep blue */
:root[data-palette="navy"] {
  --ink: #0c2340;
  --ink-soft: #1e3a5f;
  --muted: #64748b;
  --bg: #f8fafc;
  --bg-tinted: #f1f5f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --surface-inverse: #0c2340;
  --on-inverse: #f0f9ff;
  --on-inverse-muted: #94a3b8;
  --accent: #0891b2;
  --accent-soft: #cffafe;
  --accent-strong: #0e7490;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
}

/* plum — neutral stone + purple pop */
:root[data-palette="plum"] {
  --bg: #fafaf9;
  --bg-tinted: #f5f5f4;
  --ink: #1c1917;
  --ink-soft: #44403c;
  --muted: #78716c;
  --surface-inverse: #1c1917;
  --accent: #9333ea;
  --accent-soft: #f3e8ff;
  --accent-strong: #7e22ce;
  --border: #e7e5e4;
  --border-strong: #d6d3d1;
}

:root[data-density="compact"] {
  --pad-screen: 16px;
  --pad-card: 14px;
  --gap-list: 8px;
  --gap-section: 18px;
  --line-h: 1.35;
  --fs-body: 14px;
  --fs-small: 12px;
}

:root[data-theme="dark"] {
  --ink: #fafafa;
  --ink-soft: #d4d4d8;
  --muted: #a1a1aa;
  --bg: #09090b;
  --bg-tinted: #18181b;
  --surface: #18181b;
  --surface-2: #27272a;
  --surface-inverse: #fafafa;
  --on-inverse: #09090b;
  --on-inverse-muted: #52525b;

  --accent: #60a5fa;
  --accent-ink: #0c1e3e;
  --accent-soft: #1e293b;
  --accent-strong: #93c5fd;

  --positive: #4ade80;
  --positive-soft: #14532d;
  --positive-ink: #bbf7d0;

  --warn: #fbbf24;
  --warn-soft: #422006;
  --warn-ink: #fde68a;

  --danger: #f87171;
  --danger-soft: #450a0a;
  --danger-ink: #fecaca;

  --info: #38bdf8;
  --info-soft: #082f49;

  --border: #27272a;
  --border-strong: #3f3f46;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 24px 60px -20px rgba(0, 0, 0, 0.6), 0 8px 20px -8px rgba(0, 0, 0, 0.5);
  --shadow-card: 0 1px 0 rgba(0, 0, 0, 0.2), 0 1px 3px rgba(0, 0, 0, 0.3);
}

/* Warm palette in dark mode */
:root[data-theme="dark"][data-palette="warm"] {
  --ink: #f1ebde;
  --bg: #0e0c0a;
  --bg-tinted: #181410;
  --surface: #1c1814;
  --surface-2: #25201a;
  --on-inverse: #15110e;
  --on-inverse-muted: #5a5145;
  --accent: #ff6a45;
  --accent-soft: #3a1e15;
  --border: #2c251d;
  --border-strong: #3d342a;
}

/* ============================================================
   Base
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Geist', 'Inter', system-ui, sans-serif;
  font-feature-settings: 'cv11', 'ss01', 'ss02';
  background: var(--bg-tinted);
  color: var(--ink);
  font-size: var(--fs-body);
  line-height: var(--line-h);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  transition: background-color 0.25s ease, color 0.25s ease;
}
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }

/* ============================================================
   App stage — mobile-first centered device
   ============================================================ */
.stage {
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px 16px 32px;
  background:
    radial-gradient(1200px 600px at 50% -100px, color-mix(in srgb, var(--accent) 14%, transparent) 0%, transparent 60%),
    var(--bg-tinted);
}
.device {
  width: 390px;
  max-width: 100%;
  min-height: 844px;
  background: var(--bg);
  border-radius: 36px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  isolation: isolate;
}
@media (max-width: 440px) {
  .stage { padding: 0; }
  .device { border-radius: 0; min-height: 100vh; width: 100vw; box-shadow: none; }
}

/* ============================================================
   Header
   ============================================================ */
.header {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
}
.header-back {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--ink);
  display: grid;
  place-items: center;
  padding: 0;
  transition: transform 0.12s ease, background 0.15s ease;
}
.header-back:hover { background: var(--surface-2); }
.header-back:active { transform: scale(0.94); }
.header-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}
.header-title {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
  min-width: 0;
}
.header-title .name {
  font-weight: 600;
  font-size: 15px;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.header-title .name em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 17px;
}
.header-title .sub {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.header-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--ink);
  display: grid;
  place-items: center;
  padding: 0;
  transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
}
.icon-btn:hover { background: var(--surface); border-color: var(--border); }
.icon-btn:active { transform: scale(0.94); }
.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--bg);
  display: grid;
  place-items: center;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.02em;
}

/* ============================================================
   Logo
   ============================================================ */
.logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--ink);
  color: var(--bg);
  border-radius: 50%;
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-weight: 400;
  position: relative;
}
.logo::after {
  content: '';
  position: absolute;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  top: 18%;
  right: 14%;
}
.logo.s { width: 28px; height: 28px; font-size: 18px; }
.logo.s::after { width: 4px; height: 4px; }
.logo.m { width: 44px; height: 44px; font-size: 28px; }
.logo.l { width: 84px; height: 84px; font-size: 54px; box-shadow: var(--shadow-md); }
.logo.l::after { width: 10px; height: 10px; top: 16%; right: 14%; }
.logo .glyph { transform: translate(-1px, -2px); }

/* ============================================================
   Screen body
   ============================================================ */
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-behavior: smooth;
}
.screen-pad { padding: var(--pad-screen); }
.screen-pad-x { padding-left: var(--pad-screen); padding-right: var(--pad-screen); }

.section { margin-bottom: var(--gap-section); }
.section-title {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-weight: 600;
  margin: 0 0 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.section-title .count {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: 18px;
  text-transform: none;
  letter-spacing: 0;
  color: var(--ink);
}

/* ============================================================
   Typography utilities
   ============================================================ */
.eyebrow {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  font-weight: 600;
}
.h1 {
  font-size: 30px;
  line-height: 1.08;
  letter-spacing: -0.02em;
  font-weight: 600;
  margin: 0;
}
.h1 em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 34px;
}
.h2 {
  font-size: 22px;
  line-height: 1.15;
  letter-spacing: -0.015em;
  font-weight: 600;
  margin: 0;
}
.h3 {
  font-size: 17px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  font-weight: 600;
  margin: 0;
}
.lede {
  color: var(--muted);
  font-size: 14px;
  margin: 6px 0 0;
}
.mono-num {
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum';
}

/* ============================================================
   Buttons
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 14px;
  padding: 14px 18px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.005em;
  border: 1px solid transparent;
  transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  background: var(--surface);
  color: var(--ink);
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.btn-primary:hover { background: color-mix(in srgb, var(--ink) 88%, var(--accent)); }
.btn-accent {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.btn-outline {
  background: transparent;
  color: var(--ink);
  border-color: var(--border-strong);
}
.btn-outline:hover { background: var(--surface); }
.btn-ghost {
  background: transparent;
  color: var(--ink);
  border-color: transparent;
}
.btn-ghost:hover { background: var(--surface); }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }

/* ============================================================
   Cards
   ============================================================ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--pad-card);
  box-shadow: var(--shadow-card);
}
.card-tap {
  cursor: pointer;
  transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.card-tap:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
.card-tap:active { transform: scale(0.985); }
.card-dark {
  background: var(--surface-inverse);
  color: var(--on-inverse);
  border-color: var(--surface-inverse);
}
.card-dark .muted { color: var(--on-inverse-muted); }

/* ============================================================
   Inputs
   ============================================================ */
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-soft);
  letter-spacing: -0.005em;
}
.input, .select, .textarea {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  color: var(--ink);
  font-size: 15px;
  width: 100%;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--ink);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 8%, transparent);
}
.textarea { resize: vertical; min-height: 96px; line-height: 1.5; }
.input-icon {
  position: relative;
}
.input-icon > svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
.input-icon .input { padding-left: 42px; }

/* ============================================================
   Chips (filters)
   ============================================================ */
.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-soft);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}
.chip:hover { border-color: var(--border-strong); }
.chip:active { transform: scale(0.96); }
.chip.is-active {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.chip.is-active .chip-x { opacity: 0.7; }

/* ============================================================
   Filter bar — compact toolbar with active filter chips
   ============================================================ */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 0;
  margin-top: 12px;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-bar.is-sticky {
  position: sticky;
  top: 60px;
  z-index: 20;
  background: linear-gradient(to bottom, var(--bg) 60%, color-mix(in srgb, var(--bg) 0%, transparent));
  margin-left: calc(-1 * var(--pad-screen));
  margin-right: calc(-1 * var(--pad-screen));
  padding-left: var(--pad-screen);
  padding-right: var(--pad-screen);
}
.filter-trigger {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--ink);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}
.filter-trigger:hover { background: var(--surface-2); }
.filter-trigger:active { transform: scale(0.96); }
.filter-trigger.has-active {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.filter-count {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 11px;
  font-weight: 700;
  display: inline-grid;
  place-items: center;
  margin-left: 2px;
}
.filter-chips {
  display: flex;
  gap: 6px;
  flex-wrap: nowrap;
}
.filter-clear {
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  padding: 6px 8px;
  cursor: pointer;
  white-space: nowrap;
  text-decoration: underline;
  text-underline-offset: 2px;
  margin-left: auto;
  flex-shrink: 0;
}
.filter-clear:hover { color: var(--ink); }

/* ============================================================
   Bottom sheet (modal that slides up from bottom of device)
   ============================================================ */
.sheet-overlay {
  position: absolute;
  inset: 0;
  background: color-mix(in srgb, var(--ink) 35%, transparent);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.24s ease;
  display: flex;
  align-items: flex-end;
  justify-content: stretch;
}
.sheet-overlay.is-open { opacity: 1; pointer-events: auto; }
.sheet {
  width: 100%;
  background: var(--bg);
  border-radius: 24px 24px 0 0;
  padding: 8px 20px 20px;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.2, 0.7, 0.2, 1);
  max-height: 85%;
  display: flex;
  flex-direction: column;
  box-shadow: 0 -8px 30px rgba(0,0,0,0.2);
}
.sheet-overlay.is-open .sheet { transform: translateY(0); }
.sheet-grab {
  width: 40px;
  height: 4px;
  border-radius: 999px;
  background: var(--border-strong);
  margin: 4px auto 12px;
  flex-shrink: 0;
}
.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-shrink: 0;
}
.sheet-body { overflow-y: auto; padding-bottom: 8px; }

/* ============================================================
   Badges
   ============================================================ */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  background: var(--bg-tinted);
  color: var(--ink-soft);
  border: 1px solid var(--border);
}
.badge-active   { background: var(--positive-soft); color: var(--positive-ink); border-color: transparent; }
.badge-inactive { background: var(--bg-tinted); color: var(--muted); border-color: transparent; }
.badge-accent   { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }
.badge-warn     { background: var(--warn-soft); color: var(--warn-ink); border-color: transparent; }
.badge-danger   { background: var(--danger-soft); color: var(--danger-ink); border-color: transparent; }
.badge-info     { background: var(--info-soft); color: var(--info); border-color: transparent; }
.badge-counter {
  min-width: 22px;
  height: 22px;
  padding: 0 7px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--bg);
  font-size: 12px;
  display: inline-grid;
  place-items: center;
  font-weight: 600;
  letter-spacing: 0;
}
.badge-counter.accent { background: var(--accent); color: var(--accent-ink); }

/* ============================================================
   Avatar (client initial)
   ============================================================ */
.avatar-init {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-weight: 600;
  font-size: 14px;
  color: var(--ink);
  background: var(--bg-tinted);
  flex-shrink: 0;
  letter-spacing: 0.02em;
}
.avatar-init.sm { width: 32px; height: 32px; font-size: 12px; border-radius: 10px; }
.avatar-init.tone-1 { background: #f4e1d8; color: #82391d; }
.avatar-init.tone-2 { background: #e6e4d4; color: #4f4a26; }
.avatar-init.tone-3 { background: #dbe6dd; color: #265033; }
.avatar-init.tone-4 { background: #d9e1ea; color: #1f4063; }
.avatar-init.tone-5 { background: #ede2ea; color: #6a2851; }
.avatar-init.tone-6 { background: #efe2c4; color: #6a4a14; }
:root[data-theme="dark"] .avatar-init.tone-1 { background: #3d241b; color: #f0b59b; }
:root[data-theme="dark"] .avatar-init.tone-2 { background: #2e2c1f; color: #d6cfa3; }
:root[data-theme="dark"] .avatar-init.tone-3 { background: #1f3026; color: #a8d6b6; }
:root[data-theme="dark"] .avatar-init.tone-4 { background: #1f2a38; color: #a8c2dd; }
:root[data-theme="dark"] .avatar-init.tone-5 { background: #2e1f2a; color: #d8a8c4; }
:root[data-theme="dark"] .avatar-init.tone-6 { background: #2e2618; color: #e7c682; }

/* ============================================================
   Alerts (home conditional banners)
   ============================================================ */
.alert {
  border-radius: var(--radius-lg);
  padding: 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  margin-bottom: 10px;
  overflow: hidden;
}
.alert-danger { border-color: color-mix(in srgb, var(--danger) 30%, var(--border)); background: var(--danger-soft); }
.alert-warn { border-color: color-mix(in srgb, var(--warn) 30%, var(--border)); background: var(--warn-soft); }
.alert-head {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 8px;
}
.alert-head .ico {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.alert-danger .ico { background: var(--danger); color: white; }
.alert-warn .ico { background: var(--warn); color: white; }
.alert-head .title {
  font-weight: 600;
  font-size: 14px;
  letter-spacing: -0.005em;
  flex: 1;
}
.alert-danger .title { color: var(--danger-ink); }
.alert-warn .title { color: var(--warn-ink); }
.alert-head .sub {
  font-size: 12px;
  font-weight: 500;
  margin-top: 2px;
}
.alert-danger .sub { color: color-mix(in srgb, var(--danger-ink) 80%, transparent); }
.alert-warn .sub { color: color-mix(in srgb, var(--warn-ink) 80%, transparent); }
.alert-dismiss {
  width: 26px; height: 26px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  border: none;
  background: transparent;
  color: var(--ink-soft);
  flex-shrink: 0;
  margin: -3px -3px 0 0;
}
.alert-dismiss:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.alert-list { display: flex; flex-direction: column; gap: 6px; }
.alert-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--surface) 50%, transparent);
}
.alert-row .name { font-weight: 600; font-size: 13px; flex: 1; min-width: 0; }
.alert-row .name .city { color: var(--muted); font-weight: 500; }
.alert-row .counter {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: 22px;
  line-height: 1;
  flex-shrink: 0;
}
.alert-danger .alert-row .counter { color: var(--danger); }

/* ============================================================
   Module list (home cards)
   ============================================================ */
.module-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  position: relative;
  overflow: hidden;
}
.module-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
.module-card:active { transform: scale(0.985); }
.module-card .mod-ico {
  width: 48px; height: 48px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.module-card .mod-text {
  flex: 1; min-width: 0;
}
.module-card .mod-title {
  font-weight: 600;
  font-size: 15px;
  letter-spacing: -0.01em;
  margin: 0;
}
.module-card .mod-desc {
  color: var(--muted);
  font-size: 12.5px;
  margin: 2px 0 0;
  line-height: 1.35;
}
.module-card .mod-end {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  flex-shrink: 0;
}
.mod-ico.t-diag    { background: #dbeafe; color: #1e40af; }
.mod-ico.t-prosp   { background: #fee2e2; color: #b91c1c; }
.mod-ico.t-map     { background: #dcfce7; color: #15803d; }
.mod-ico.t-indic   { background: #f3e8ff; color: #7e22ce; }
.mod-ico.t-check   { background: #fef3c7; color: #92400e; }
:root[data-theme="dark"] .mod-ico.t-diag    { background: #1e293b; color: #93c5fd; }
:root[data-theme="dark"] .mod-ico.t-prosp   { background: #3b1212; color: #fca5a5; }
:root[data-theme="dark"] .mod-ico.t-map     { background: #14291a; color: #86efac; }
:root[data-theme="dark"] .mod-ico.t-indic   { background: #2e1838; color: #d8b4fe; }
:root[data-theme="dark"] .mod-ico.t-check   { background: #3d2a10; color: #fcd34d; }

/* ============================================================
   Client list row
   ============================================================ */
.list { display: flex; flex-direction: column; gap: var(--gap-list); }
.client-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  cursor: pointer;
  transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.client-row:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
.client-row:active { transform: scale(0.99); }
.client-row .body { flex: 1; min-width: 0; }
.client-row .name {
  font-weight: 600;
  font-size: 14.5px;
  letter-spacing: -0.005em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.client-row .sub {
  font-size: 12.5px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 2px;
}
.client-row .sub .dot { width: 3px; height: 3px; background: currentColor; border-radius: 50%; opacity: 0.5; }
.client-row .end { display: flex; align-items: center; gap: 10px; flex-shrink: 0; color: var(--muted); }

/* ============================================================
   KPI grid (diagnostico/prospeccao detail)
   ============================================================ */
.kpi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.kpi {
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
}
.kpi .lbl {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  font-weight: 600;
}
.kpi .val {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.015em;
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}
.kpi .val.small { font-size: 14px; }

/* Big KPI on dashboard */
.kpi-big {
  padding: 20px;
  background: var(--ink);
  color: var(--bg);
  border-radius: 22px;
  position: relative;
  overflow: hidden;
}
.kpi-big::before {
  content: '';
  position: absolute;
  right: -40px;
  top: -40px;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle at center, var(--accent) 0%, transparent 60%);
  opacity: 0.6;
  pointer-events: none;
}
.kpi-big .lbl {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: color-mix(in srgb, var(--bg) 60%, transparent);
  font-weight: 600;
  position: relative;
  z-index: 1;
}
.kpi-big .val {
  font-size: 38px;
  font-weight: 600;
  letter-spacing: -0.025em;
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
  position: relative;
  z-index: 1;
}
.kpi-big .val em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 30px;
  margin-right: 4px;
  color: color-mix(in srgb, var(--bg) 70%, transparent);
}
.kpi-big .delta {
  margin-top: 8px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 500;
  position: relative;
  z-index: 1;
  color: #93e6a8;
}

/* ============================================================
   Score circle
   ============================================================ */
.score {
  width: 64px;
  height: 64px;
  position: relative;
  flex-shrink: 0;
}
.score svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.score .track { stroke: color-mix(in srgb, currentColor 25%, transparent); }
.score .fill { stroke: var(--accent); transition: stroke-dashoffset 0.8s ease; }
.score .label {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 16px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.score .label em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-weight: 400;
  color: var(--on-inverse-muted);
  font-size: 11px;
  margin-left: 1px;
}

/* ============================================================
   Pill tabs (diagnostico)
   ============================================================ */
.pills {
  display: inline-flex;
  background: var(--bg-tinted);
  border-radius: 999px;
  padding: 4px;
  width: 100%;
  gap: 0;
}
.pill {
  flex: 1;
  border: none;
  background: transparent;
  padding: 8px 14px;
  font-weight: 600;
  font-size: 13px;
  color: var(--muted);
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
}
.pill.is-active {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(21,17,14,0.08);
}

/* ============================================================
   Bordered item list (analise oportunidades / atenção / cortes)
   ============================================================ */
.bordered-list { display: flex; flex-direction: column; gap: 8px; }
.bordered-item {
  padding: 10px 12px;
  border-radius: 10px;
  border-left: 3px solid var(--border);
  background: var(--surface-2);
  font-size: 13.5px;
  line-height: 1.4;
}
.bordered-item.positive { border-left-color: var(--positive); }
.bordered-item.danger { border-left-color: var(--danger); }
.bordered-item.info { border-left-color: var(--info); }
.bordered-item strong { font-weight: 600; }

/* ============================================================
   Map
   ============================================================ */
.map-wrap {
  position: relative;
  height: 280px;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: linear-gradient(135deg, #e8e2d2 0%, #ddd5c2 100%);
}
:root[data-theme="dark"] .map-wrap {
  background: linear-gradient(135deg, #1a1612 0%, #221c16 100%);
}
.map-pin {
  position: absolute;
  transform: translate(-50%, -100%);
  cursor: pointer;
}
.map-pin .head {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 3px solid white;
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  position: relative;
}
.map-pin .head::after {
  content: '';
  position: absolute;
  bottom: -6px; left: 50%;
  transform: translateX(-50%) rotate(45deg);
  width: 8px; height: 8px;
  background: inherit;
  border-right: 3px solid white;
  border-bottom: 3px solid white;
}
/* Map pin colors — use accent for prospect/route, fixed greens/grays for status */
.map-pin.s-active   { color: var(--positive); }
.map-pin.s-inactive { color: var(--muted); }
.map-pin.s-prospect { color: var(--accent); }
.map-pin.s-route    { color: var(--info); }
.map-pin .head { background: currentColor; }
.map-pin.in-route::before {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 2px solid currentColor;
  opacity: 0.3;
  animation: ping 1.6s ease-out infinite;
}
@keyframes ping {
  0% { transform: scale(0.6); opacity: 0.6; }
  100% { transform: scale(1.5); opacity: 0; }
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  margin-top: 12px;
}
.legend .swatch {
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 50%;
  margin-right: 5px;
  vertical-align: middle;
}

/* ============================================================
   Route panel
   ============================================================ */
.route-point {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--surface-2);
  border-radius: 12px;
  border: 1px solid var(--border);
}
.route-point .num {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--bg);
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.route-point .name { flex: 1; font-size: 14px; font-weight: 500; min-width: 0; }
.route-point .x {
  width: 24px; height: 24px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: transparent;
  border: none;
  color: var(--muted);
}
.route-point .x:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--ink); }

.ai-box {
  margin-top: 12px;
  padding: 12px;
  background: var(--accent-soft);
  border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--border));
  border-radius: 14px;
}
.ai-box .lbl {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  color: var(--accent-strong);
}
.ai-box .body {
  margin-top: 6px;
  font-size: 13px;
  line-height: 1.45;
  color: var(--ink);
}

/* ============================================================
   Progress bar
   ============================================================ */
.progress {
  height: 6px;
  background: var(--bg-tinted);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}
.progress .bar {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--ink);
  border-radius: 999px;
  transition: width 0.8s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.progress.accent .bar { background: var(--accent); }
.progress.positive .bar { background: var(--positive); }

/* ============================================================
   Visit card (Última visita)
   ============================================================ */
.visit-card {
  display: flex;
  gap: 12px;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  position: relative;
}
.visit-card.pending {
  border-left: 4px solid var(--accent);
}
.visit-card .ico {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.visit-card .body { flex: 1; min-width: 0; }
.visit-card .name { font-weight: 600; font-size: 14px; }
.visit-card .result { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.visit-card .date { font-size: 12px; color: var(--muted); flex-shrink: 0; font-variant-numeric: tabular-nums; }

/* ============================================================
   Checkbox (ficha visita)
   ============================================================ */
.check-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.15s ease;
}
.check-row:hover { background: var(--surface-2); }
.check-row .box {
  width: 20px; height: 20px;
  border-radius: 6px;
  border: 1.5px solid var(--border-strong);
  background: var(--surface);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: background 0.15s ease, border-color 0.15s ease;
  margin-top: 1px;
}
.check-row .lbl { font-size: 13.5px; line-height: 1.4; }
.check-row.is-checked .box {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
}
.check-row.is-checked .lbl {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent);
}

/* ============================================================
   Success toast (check-in)
   ============================================================ */
.toast-success {
  position: absolute;
  left: 16px; right: 16px;
  bottom: 16px;
  background: var(--positive);
  color: white;
  padding: 14px 16px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 14px;
  box-shadow: 0 12px 30px -10px rgba(31, 122, 58, 0.5);
  animation: toastIn 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
  z-index: 50;
}
@keyframes toastIn {
  0% { transform: translateY(20px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}
.toast-success.is-leaving { animation: toastOut 0.3s ease forwards; }
@keyframes toastOut {
  to { transform: translateY(20px); opacity: 0; }
}

/* ============================================================
   Spinner (AI thinking)
   ============================================================ */
.spinner-block {
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.spinner {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 3px solid var(--bg-tinted);
  border-top-color: var(--accent);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.spinner-text {
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   Animations
   ============================================================ */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeIn 0.35s cubic-bezier(0.2, 0.7, 0.2, 1); }
.fade-in-delay-1 { animation: fadeIn 0.4s 0.05s cubic-bezier(0.2,0.7,0.2,1) backwards; }
.fade-in-delay-2 { animation: fadeIn 0.4s 0.1s cubic-bezier(0.2,0.7,0.2,1) backwards; }
.fade-in-delay-3 { animation: fadeIn 0.4s 0.15s cubic-bezier(0.2,0.7,0.2,1) backwards; }

.screen-enter { animation: screenIn 0.32s cubic-bezier(0.2, 0.7, 0.2, 1); }
@keyframes screenIn {
  from { opacity: 0; transform: translateX(16px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ============================================================
   Helpers
   ============================================================ */
.row { display: flex; align-items: center; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }
.flex-1 { flex: 1; }
.mt-1 { margin-top: 6px; } .mt-2 { margin-top: 10px; } .mt-3 { margin-top: 14px; } .mt-4 { margin-top: 18px; } .mt-5 { margin-top: 24px; }
.mb-1 { margin-bottom: 6px; } .mb-2 { margin-bottom: 10px; } .mb-3 { margin-bottom: 14px; } .mb-4 { margin-bottom: 18px; }
.txt-muted { color: var(--muted); }
.txt-accent { color: var(--accent); }
.txt-positive { color: var(--positive); }
.txt-danger { color: var(--danger); }
.txt-12 { font-size: 12px; } .txt-13 { font-size: 13px; } .txt-14 { font-size: 14px; }
.fw-6 { font-weight: 600; }
.tabular { font-variant-numeric: tabular-nums; }
.divider { height: 1px; background: var(--border); margin: 16px 0; border: none; }
.italic-serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }

  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
/* =========================================================================

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

/* ============================================================
   Score circle
   ============================================================ */
function Score({ value, max = 10, size = 64 }) {
  const r = size/2 - 5;
  const c = 2 * Math.PI * r;
  const pct = Math.max(0, Math.min(1, value/max));
  const offset = c * (1 - pct);
  return (
    <div className="score" style={{ width: size, height: size }}>
      <svg viewBox={`0 0 ${size} ${size}`}>
        <circle className="track" cx={size/2} cy={size/2} r={r} fill="none" strokeWidth="5"/>
        <circle className="fill" cx={size/2} cy={size/2} r={r} fill="none"
                strokeWidth="5" strokeLinecap="round"
                strokeDasharray={c} strokeDashoffset={offset}/>
      </svg>
      <div className="label">{value}<em>/{max}</em></div>
    </div>
  );
}

/* ============================================================
   Avatar with initial (tone derived from name)
   ============================================================ */
function AvatarInit({ name, sm }) {
  const tone = useMemo(() => {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return (h % 6) + 1;
  }, [name]);
  const init = useMemo(() => {
    const parts = name.split(' ').filter(Boolean);
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return name.slice(0, 2).toUpperCase();
  }, [name]);
  return <div className={`avatar-init ${sm ? 'sm' : ''} tone-${tone}`}>{init}</div>;
}

/* ============================================================
   Progress bar
   ============================================================ */
function Progress({ value, max = 100, tone }) {
  const pct = Math.max(0, Math.min(100, (value/max)*100));
  return (
    <div className={`progress ${tone || ''}`}>
      <div className="bar" style={{ width: `${pct}%` }}/>
    </div>
  );
}

/* ============================================================
   AI spinner with rotating phrases
   ============================================================ */
function AISpinner({ phrases = ['Pensando...', 'Analisando dados...', 'Cruzando histórico...', 'Refinando...'] }) {
  const [i, setI] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setI(x => (x + 1) % phrases.length), 1200);
    return () => clearInterval(t);
  }, [phrases.length]);
  return (
    <div className="spinner-block">
      <div className="spinner"/>
      <div className="spinner-text">{phrases[i]}</div>
    </div>
  );
}

/* ============================================================
   FilterBar — compact row + bottom sheet for filtering
   ============================================================ */
function FilterBar({ filters, values, onChange, sticky = true }) {
  const activeCount = filters.reduce((s, f) => s + (values[f.key] ? 1 : 0), 0);

  function clearAll() {
    filters.forEach(f => onChange(f.key, null));
  }

  // versão select inline — compacta e prática no mobile
  return (
    <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 12, alignItems: 'center' }}>
      {filters.map(f => (
        <select
          key={f.key}
          className="select"
          value={values[f.key] || ''}
          onChange={e => onChange(f.key, e.target.value || null)}
          style={{ flex: 1, minWidth: 100, fontSize: 13, padding: '8px 10px' }}
        >
          <option value="">{f.label}</option>
          {(f.options || []).map(o => {
            const val = typeof o === 'object' ? o.value : o;
            const lbl = typeof o === 'object' ? o.label : o;
            return <option key={val} value={val}>{lbl}</option>;
          })}
        </select>
      ))}
      {activeCount > 0 && (
        <button className="btn btn-ghost btn-sm" onClick={clearAll} style={{ whiteSpace: 'nowrap', fontSize: 12 }}>
          <Icon.x size={12}/> Limpar
        </button>
      )}
    </div>
  );

  // versão legada não usada
  function labelOf(filter) {
    const v = values[filter.key];
    if (!v) return null;
    const opt = (filter.options || []).find(o => (typeof o === 'object' ? o.value : o) === v);
    return opt ? (typeof opt === 'object' ? opt.label : opt) : v;
  }

  return (
    <>
      <div className={`filter-bar ${sticky ? 'is-sticky' : ''}`}>
        <button className={`filter-trigger ${activeCount > 0 ? 'has-active' : ''}`} onClick={() => setOpen(true)}>
          <Icon.filter size={13}/>
          <span>Filtros</span>
          {activeCount > 0 && <span className="filter-count">{activeCount}</span>}
        </button>
        <div className="filter-chips">
          {filters.map(f => {
            const lbl = labelOf(f);
            if (!lbl) return null;
            return (
              <button key={f.key} className="chip is-active" onClick={() => onChange(f.key, null)}>
                <span style={{ opacity: 0.7, fontWeight: 500, fontSize: 11 }}>{f.label}:</span> {lbl}
                <Icon.x size={11} className="chip-x"/>
              </button>
            );
          })}
        </div>
        {activeCount > 0 && (
          <button className="filter-clear" onClick={clearAll}>Limpar</button>
        )}
      </div>

      <BottomSheet open={open} onClose={() => setOpen(false)} title="Filtros">
        <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
          {filters.map(f => (
            <div key={f.key}>
              <div className="eyebrow" style={{ marginBottom: 8 }}>{f.label}</div>
              <div className="chip-row">
                {(f.options || []).map(o => {
                  const val = typeof o === 'object' ? o.value : o;
                  const lbl = typeof o === 'object' ? o.label : o;
                  const active = values[f.key] === val;
                  return (
                    <Chip key={val} active={active} onClick={() => onChange(f.key, active ? null : val)} removable>
                      {lbl}
                    </Chip>
                  );
                })}
              </div>
            </div>
          ))}
          <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
            <button className="btn btn-ghost btn-block btn-sm" onClick={() => { clearAll(); }}>Limpar tudo</button>
            <button className="btn btn-primary btn-block btn-sm" onClick={() => setOpen(false)}>Aplicar{activeCount > 0 ? ` (${activeCount})` : ''}</button>
          </div>
        </div>
      </BottomSheet>
    </>
  );
}

/* ============================================================
   BottomSheet — slides up from bottom of device
   ============================================================ */
function BottomSheet({ open, onClose, title, children }) {
  const [mounted, setMounted] = useState(false);
  useEffect(() => {
    if (open) {
      setMounted(true);
    } else {
      const t = setTimeout(() => setMounted(false), 240);
      return () => clearTimeout(t);
    }
  }, [open]);

  if (!mounted && !open) return null;

  return (
    <div className={`sheet-overlay ${open ? 'is-open' : ''}`} onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="sheet-grab"/>
        <div className="sheet-head">
          <h3 className="h3">{title}</h3>
          <button className="icon-btn" onClick={onClose} aria-label="Fechar"><Icon.x size={16}/></button>
        </div>
        <div className="sheet-body">{children}</div>
      </div>
    </div>
  );
}

/* ============================================================
   Currency formatter
   ============================================================ */
function brl(n, opts = {}) {
  const { compact, noSymbol } = opts;
  if (compact && n >= 1000) {
    const k = n / 1000;
    return `${noSymbol ? '' : 'R$ '}${k.toFixed(k >= 100 ? 0 : 1).replace('.', ',')}k`;
  }
  return (noSymbol ? '' : 'R$ ') + n.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

/* ============================================================
   Export to window so screens.jsx can use these
   ============================================================ */
Object.assign(window, {
  Icon, Score, Logo, Header, Chip, SearchInput, AvatarInit, Progress, AISpinner, brl,
  FilterBar, BottomSheet,
});

  </script>

   Screen 7 — Mapa & Rota
   ============================================================ */
function MapScreen({ back, user, theme, onToggleTheme }) {
  const [city, setCity] = useState(null);
  const [status, setStatus] = useState(null);
  const [route, setRoute] = useState([]); // array of client/prospect ids
  const [aiText, setAiText] = useState(null);
  const [aiLoading, setAiLoading] = useState(false);

  // Combine clients + prospects into pin list with positions
  const points = useMemo(() => {
    const cli = CLIENTS.map((c, i) => ({
      id: c.id, name: c.name, city: c.city, kind: 'client',
      status: c.status === 'active' ? 'active' : 'inactive',
      // semi-deterministic positions in [10..90]
      x: 15 + ((i * 73) % 70), y: 15 + ((i * 47) % 65)
    }));
    const pro = PROSPECTS.map((p, i) => ({
      id: p.id, name: p.name, city: p.city, kind: 'prospect',
      status: 'prospect',
      x: 10 + ((i * 91) % 75), y: 35 + ((i * 53) % 50)
    }));
    return [...cli, ...pro];
  }, []);

  const filtered = points.filter(p => {
    if (city && p.city !== city) return false;
    if (status && p.status !== status) return false;
    return true;
  });

  function addToRoute(id) {
    setRoute(r => r.includes(id) ? r : [...r, id]);
    setAiText(null);
  }
  function removeFromRoute(id) { setRoute(r => r.filter(x => x !== id)); setAiText(null); }
  function clearRoute() { setRoute([]); setAiText(null); }
  function suggestAI() {
    setAiLoading(true);
    setAiText(null);
    setTimeout(() => {
      setAiLoading(false);
      // reorder route smartly (cluster by city, prospects last)
      const ids = [...route];
      ids.sort((a, b) => {
        const pa = points.find(p => p.id === a);
        const pb = points.find(p => p.id === b);
        return (pa.city + pa.kind).localeCompare(pb.city + pb.kind);
      });
      setRoute(ids);
      setAiText('Rota agrupada por cidade. Começamos em Campinas (3 paradas), seguimos para Jundiáí e fechamos com 1 prospecto premium em Ribeirão Preto. Economia estimada: 28% de deslocamento.');
    }, 1700);
  }

  const routeObjs = route.map(id => points.find(p => p.id === id)).filter(Boolean);

  return (
    <div className="screen screen-enter" data-screen-label="07 Mapa">
      <Header user={user} theme={theme} onToggleTheme={onToggleTheme} onBack={back} subtitle="Mapa & Rota"/>
      <div className="screen-pad">
        <div className="eyebrow">Sua região</div>
        <h2 className="h2 mt-1">Mapa <em className="italic-serif">&</em> rota</h2>

        <FilterBar
          filters={[
            { key: 'city',   label: 'Cidade', options: CITIES.slice(0, 6) },
            { key: 'status', label: 'Status', options: [
              {value:'active', label:'Ativos'},
              {value:'inactive', label:'Inativos'},
              {value:'prospect', label:'Prospectos'},
            ]},
          ]}
          values={{ city, status }}
          onChange={(k, v) => { if(k==='city') setCity(v); if(k==='status') setStatus(v); }}
        />

        <div className="mt-3">
          <FakeMap points={filtered} routeIds={route}/>
        </div>
        <div className="legend">
          <span><span className="swatch" style={{background:'var(--positive)'}}/>Ativo</span>
          <span><span className="swatch" style={{background:'var(--muted)'}}/>Inativo</span>
          <span><span className="swatch" style={{background:'var(--accent)'}}/>Prospecto</span>
          <span><span className="swatch" style={{background:'var(--info)'}}/>Na rota</span>
        </div>

        <div className="card mt-3">
          <div className="row-between mb-2">
            <div className="row gap-2"><Icon.map size={16}/> <strong className="txt-14">Rota de hoje</strong></div>
            <span className="badge badge-counter">{route.length}</span>
          </div>
          {routeObjs.length === 0 ? (
            <div className="bordered-item" style={{ background:'var(--surface-2)', borderLeftColor:'var(--border-strong)', color:'var(--muted)', fontSize: 13 }}>
              Sua rota está vazia. Adicione clientes ou prospectos abaixo com <strong style={{color:'var(--ink)'}}>+ rota</strong>.
            </div>
          ) : (
            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              {routeObjs.map((p, i) => (
                <div key={p.id} className="route-point">
                  <span className="num">{i+1}</span>
                  <div className="name">{p.name} <span className="txt-12 txt-muted">· {p.city}</span></div>
                  <button className="x" onClick={()=>removeFromRoute(p.id)}><Icon.x size={14}/></button>
                </div>
              ))}
            </div>
          )}
          <div className="row gap-2 mt-3" style={{ flexWrap: 'wrap' }}>
            <button className="btn btn-primary btn-sm" disabled={routeObjs.length < 2} onClick={suggestAI}>
              <Icon.sparkles size={14}/> Sugerir rota
            </button>
            <button className="btn btn-outline btn-sm" disabled={routeObjs.length === 0}>
              <Icon.external size={14}/> Google Maps
            </button>
            <button className="btn btn-ghost btn-sm" disabled={routeObjs.length === 0} onClick={clearRoute}>
              <Icon.trash size={14}/> Limpar
            </button>
          </div>
          {aiLoading && (
            <div className="mt-3"><AISpinner phrases={['Calculando trajeto...', 'Otimizando paradas...', 'Refinando ordem...']}/></div>
          )}
          {aiText && !aiLoading && (
            <div className="ai-box fade-in mt-3">
              <div className="lbl"><Icon.sparkles size={11}/> Sugestão da IA</div>
              <div className="body">{aiText}</div>
            </div>
          )}
        </div>

        <div className="section mt-4">
          <div className="section-title">Pontos disponíveis <span className="count">{filtered.length}</span></div>
          <div className="list">
            {[...filtered].sort((a,b) => {
              const dA = CLIENTS.find(x=>x.id===a.id)?.lastVisitDays || 0;
              const dB = CLIENTS.find(x=>x.id===b.id)?.lastVisitDays || 0;
              return dB - dA;
            }).map(p => {
              const cli = CLIENTS.find(x=>x.id===p.id);
              const overdue = cli && cli.lastVisitDays >= 7;
              return (
                <div key={p.id} className="client-row" style={{ cursor: 'default', borderColor: overdue ? 'var(--danger)' : undefined, background: overdue ? 'var(--danger-soft)' : undefined }}>
                  <AvatarInit name={p.name}/>
                  <div className="body">
                    <div className="name">{p.name} {overdue && <span className="badge badge-danger" style={{marginLeft:6, fontSize:10}}>Prioridade · {cli.lastVisitDays}d</span>}</div>
                    <div className="sub">
                      <Icon.pin size={11}/> {p.city}
                      <span className="dot"/>
                      {p.kind === 'client' ? (p.status === 'active' ? 'Cliente ativo' : 'Cliente inativo') : 'Prospecto'}
                    </div>
                  </div>
                  <div className="end">
                    <button className="btn btn-sm btn-outline" disabled={route.includes(p.id)} onClick={()=>addToRoute(p.id)}>
                      <Icon.plus size={12}/> {route.includes(p.id) ? 'na rota' : 'rota'}
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

function FakeMap({ points, routeIds }) {
  // Stylized "map" — abstract topographic shapes as backdrop
  return (
    <div className="map-wrap">
      <svg viewBox="0 0 100 80" preserveAspectRatio="none" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', opacity: 0.5 }}>
        <defs>
          <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse">
            <path d="M 6 0 L 0 0 0 6" fill="none" stroke="currentColor" strokeWidth="0.18" style={{color:'var(--border-strong)'}}/>
          </pattern>
        </defs>
        <rect width="100" height="80" fill="url(#grid)"/>
        {/* abstract land shapes */}
        <path d="M0,40 Q20,30 35,38 T70,42 T100,38 L100,80 L0,80 Z" fill="currentColor" style={{color:'var(--border)'}} opacity="0.6"/>
        <path d="M10,60 Q30,55 50,62 T90,58 L90,80 L10,80 Z" fill="currentColor" style={{color:'var(--border-strong)'}} opacity="0.4"/>
        {/* roads */}
        <path d="M5,20 Q40,25 65,40 T98,55" fill="none" stroke="currentColor" strokeWidth="0.5" style={{color:'var(--muted)'}} opacity="0.5"/>
        <path d="M20,5 Q30,30 45,50 T70,75" fill="none" stroke="currentColor" strokeWidth="0.4" style={{color:'var(--muted)'}} opacity="0.4"/>
        {/* route connecting lines */}
        {routeIds.length > 1 && (() => {
          const routePts = routeIds.map(id => points.find(p => p.id === id)).filter(Boolean);
          if (routePts.length < 2) return null;
          const path = routePts.map((p, i) => `${i===0?'M':'L'}${p.x},${p.y}`).join(' ');
          return <path d={path} fill="none" stroke="var(--info)" strokeWidth="0.8" strokeDasharray="2 1.5" opacity="0.7"/>;
        })()}
      </svg>
      {points.map(p => {
        const inRoute = routeIds.includes(p.id);
        const cls = inRoute ? 's-route in-route' : p.status === 'active' ? 's-active' : p.status === 'inactive' ? 's-inactive' : 's-prospect';
        return (
          <div key={p.id} className={`map-pin ${cls}`} style={{ left: `${p.x}%`, top: `${p.y}%` }} title={p.name}>
            <div className="head"/>
          </div>
        );
      })}
    </div>
  );
}
